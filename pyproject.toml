[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pypolycall"
version = "1.5.0"
description = "Python adapter for libpolycall (thin ctypes FFI over the shared core)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Nnamdi Michael Okpala", email = "okpalan@protonmail.com" }]
keywords = ["polycall", "ffi", "obinexus", "adapter"]

[project.urls]
Homepage = "https://www.libpolycall.obinexus.org"
Repository = "https://github.com/obinexus/libpolycall"

[tool.setuptools.packages.find]
where = ["src"]
